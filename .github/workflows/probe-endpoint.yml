# A one-off probe: run the endpoint test inside the runner, where the key lives.
#
# The key is a repository secret and cannot be read back by the CLI, so the only machine that can run this test is a
# runner. The step writes nothing and publishes nothing - it makes one request and prints what came back.
name: Probe an Ark endpoint

on:
  workflow_dispatch:
    inputs:
      endpoint:
        description: "The ep-... id to probe"
        required: true
        default: "ep-20261019161601-9k6dn"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Probe
        env:
          ARK_API_KEY: ${{ secrets.ARK_API_KEY || secrets.DUBAO201628 || secrets.APIKEY20261016201628 }}
        run: node tools/probe-pro-endpoint.mjs "${{ inputs.endpoint }}"