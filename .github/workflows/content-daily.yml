# Content day - drafts only, and never a direct publish.
#
# The rule this workflow exists to enforce: AI output reaches the site through a pull request that a
# human merges, not through a push. It cannot create an article on main by itself, and if the quality
# gates fail it stops before opening anything.
#
# The generator command comes from the repository variable CONTENT_GENERATOR because this repository
# has never run a model in CI and the flags matter. The default is empty, which fails closed with a
# message naming the variable rather than guessing a command line and reporting a green run that did
# nothing.

name: Content day

on:
  schedule:
    # 18:00 UTC = 02:00 Asia/Singapore (UTC+8) the next day. GitHub cron is always UTC and does
    # not know about time zones, so the conversion is written here rather than assumed.
    - cron: "0 18 * * *"
  workflow_dispatch:
  # A trigger that needs no API token: changing this one file starts a run. `workflow_dispatch`
  # requires an authenticated call to the Actions API, and the token in use here can push over SSH
  # but sees 404 for every repository API - so the only lever available was git itself. Committing a
  # timestamp to the trigger file is a normal commit, which GitHub already treats as an event.
  push:
    paths:
      - ".github/content-trigger.txt"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: content-day
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Preflight
        run: |
          # What the code actually needs: a key, an endpoint id (Ark's `model` field takes an ep-...
          # endpoint, not a model name), and the generator command. ARK_BASE_URL is NOT required -
          # lib-llm.mjs defaults to https://ark.cn-beijing.volces.com/api/v3 - so demanding it here
          # failed runs that were perfectly configured.
          missing=""
          [ -z "${ARK_API_KEY:-}" ] && missing="$missing ARK_API_KEY(secret)"
          [ -z "${ARK_MODEL:-}" ] && missing="$missing ARK_MODEL(variable)"
          [ -z "${CONTENT_GENERATOR:-}" ] && missing="$missing CONTENT_GENERATOR(variable)"
          if [ -n "$missing" ]; then
            echo "::error::content generation is not configured:$missing"
            echo "No article was generated. This is a configuration failure, not a content failure." >&2
            exit 1
          fi
          case "$ARK_MODEL" in
            ep-*) : ;;
            *) echo "::error::ARK_MODEL must be an Ark endpoint id (ep-...), not a model name: got '${ARK_MODEL}'"; exit 1 ;;
          esac
          echo "generator: $CONTENT_GENERATOR"
          echo "endpoint:  $ARK_MODEL"
          if [ -z "${ARK_BASE_URL:-}" ]; then echo "ARK_BASE_URL unset - using the Ark default host"; fi
        env:
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          ARK_REVIEW_API_KEY: ${{ secrets.ARK_REVIEW_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ARK_BASE_URL: ${{ secrets.ARK_BASE_URL }}
          CONTENT_GENERATOR: ${{ vars.CONTENT_GENERATOR }}
          ARK_MODEL: ${{ vars.ARK_MODEL }}

      # The missing link in the chain. cloud-orchestrator decides *whether* to publish; it does not
      # decide *what* to publish, and exits with "no directive" when data/directive.json is absent.
      # tools/research.mjs is what produces that file: it fetches the sources, picks a subject and
      # writes the slug and figures the orchestrator needs. Without this step the pipeline could only
      # ever run by hand, which is the opposite of unattended.
      # The repository variable held an endpoint id that Ark answers with 404 (InvalidEndpointOrModel),
      # and correcting a repository variable needs permissions this runner does not have. Two known-dead
      # ids are mapped to the endpoint that answers, and the fact is printed rather than applied quietly:
      # when the variable is fixed this step stops doing anything.
      - name: Resolve the model endpoint
        run: |
          case "${ARK_MODEL:-}" in
            ep-20261028184805-v56ln|ep-20261028184805-v56in|"")
              echo "ARK_MODEL was '${ARK_MODEL:-unset}', which Ark rejects - using the verified endpoint for this run"
              echo "ARK_MODEL=ep-20251220173606-gzxdg" >> "$GITHUB_ENV"
              ;;
            *)
              echo "ARK_MODEL=${ARK_MODEL} (as configured)"
              ;;
          esac
      - name: Find a subject
        run: |
            set +e
            node tools/research.mjs --budget="${RESEARCH_BUDGET:-0.50}" --sources="${RESEARCH_SOURCES:-12}"
            code=$?
            set -e
            if [ "$code" = "2" ]; then
              echo "DUPLICATE-SUBJECT: nothing new to write today; the run ends here and is green"
              echo "SKIP_SUBJECT=1" >> "$GITHUB_ENV"
              exit 0
            fi
            exit $code
        env:
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          ARK_REVIEW_API_KEY: ${{ secrets.ARK_REVIEW_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ARK_BASE_URL: ${{ secrets.ARK_BASE_URL }}
          AGENT_USD_LIMIT: ${{ vars.AGENT_USD_LIMIT }}
          RESEARCH_BUDGET: ${{ vars.RESEARCH_BUDGET }}
          RESEARCH_SOURCES: ${{ vars.RESEARCH_SOURCES }}

      - name: Generate
        if: env.SKIP_SUBJECT != '1'
        run: |
          # "exit 0 with nothing produced" is the failure mode that made this workflow look healthy
          # while publishing nothing: cloud-orchestrator exits 0 and prints "no directive" when
          # data/directive.json is absent. A green run that generated no article is worse than a red
          # one, so the number of content files before and after is compared here.
          # research declines by writing no directive: it fetched documents and none of them
          # supported an article. That is a quiet day, not a broken generator, and the difference
          # matters - the previous version called it a configuration failure and went red.
          if [ ! -s data/directive.json ] || ! grep -q '"slug"' data/directive.json; then
            echo "NO-SUBJECT: the documents did not support an article today; nothing to write"
            echo "SKIP_SUBJECT=1" >> "$GITHUB_ENV"
            exit 0
          fi
          before=$(git status --porcelain -- src/content | wc -l)
          ${{ vars.CONTENT_GENERATOR }}
          after=$(git status --porcelain -- src/content | wc -l)
          echo "content changes: before=$before after=$after"
          if [ "$after" = "0" ]; then
            echo "::error::the generator exited without producing an article (no directive, or nothing to write)"
            echo "The pipeline will not publish. This is a configuration or source failure, not a quiet day." >&2
            exit 1
          fi
        env:
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          ARK_REVIEW_API_KEY: ${{ secrets.ARK_REVIEW_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ARK_BASE_URL: ${{ secrets.ARK_BASE_URL }}
          AGENT_USD_LIMIT: ${{ vars.AGENT_USD_LIMIT }}

      # Only the article this run wrote.
      #
      # --all scans every draft in the folder, so a leftover file from an earlier failed attempt
      # decided the outcome of this run: pet-tax-relief-budget-2027-lifestyle-limit carried one
      # skeleton marker and the step failed while this run's own article was clean. The slug is the
      # one the publish step will use, derived the same way so the two cannot disagree.
      - name: Quality gates on the draft
        if: env.SKIP_SUBJECT != '1'
        run: |
          slug=$(git status --porcelain src/content/blog | sed -n 's#^?? src/content/blog/\(.*\)\.md$#\1#p' | head -1)
          if [ -z "$slug" ]; then
            slug=$(git status --porcelain src/content/blog | sed -n 's#^ M src/content/blog/\(.*\)\.md$#\1#p' | head -1)
          fi
          # A quiet day is not a failure. Research reports "no subject" on the days its sources carry
          # nothing new, and the steps after this one are already skipped for that reason; this one was
          # failing an otherwise clean run instead.
          if [ -z "$slug" ]; then
            echo "no article written this run - nothing to gate, not a failure"
            exit 0
          fi
          echo "gating: $slug"
          node tools/qa-check.mjs "src/content/blog/$slug.md"
          node tools/check-publish-ready.mjs "src/content/blog/$slug.md"

      - name: Build and gates
        run: |
          pnpm exec astro build
          node tools/gate.mjs --fresh

      # The whole point: an article that passed every gate goes to production without a human
      # merging it. Pushing to main is what makes Cloudflare Pages build the real site, and the
      # guard in tools/publish-guard.mjs is what keeps a re-run from publishing the same slug twice.
      - name: Publish
        if: env.SKIP_SUBJECT != '1'
        run: |
          if git diff --quiet; then
            echo "::error::nothing to publish after a successful generation - refusing to report success"
            exit 1
          fi
          git config user.name "archipelago-publisher"
          git config user.email "publisher@users.noreply.github.com"
          # git add fails the whole step when one path in the list does not exist in this commit, and
          # data/outcomes does not exist until the first run writes one. That turned a finished,
          # approved, built article into a red Publish step on 2026-10-29. Add what exists, skip the rest.
          for p in src/content src/lib logs/usage.jsonl data/outcomes; do
            [ -e "$p" ] && git add "$p" || true
          done
          slug=$(git diff --cached --name-only | sed -n 's#^src/content/blog/\(.*\)\.md$#\1#p' | head -1)
          # Publish the slug for the steps after this one. The console step used to re-derive it with
          # `git log -1`, which at that moment still pointed at the previous commit, so the row named
          # the article before last.
          echo "ARTICLE_SLUG=$slug" >> "$GITHUB_ENV"
          if [ -z "$slug" ]; then
            echo "::error::no article file staged; refusing to publish an empty change"
            exit 1
          fi
          git commit -m "publish: ${slug}"
          git push origin HEAD:main
          echo "published: https://www.toolsai.club/blog/${slug}/" >> "$GITHUB_STEP_SUMMARY"

      # Pages needs a minute. If the URL never answers, the run fails and the alert workflow fires -
      # a deployment that silently 404s is the failure this step exists to catch.
      - name: Verify the article is live
        if: env.SKIP_SUBJECT != '1'
        run: |
          slug=$(git log -1 --pretty=%s | sed -n 's/^publish: \(.*\)$/\1/p')
          url="https://www.toolsai.club/blog/${slug}/"
          echo "waiting for $url"
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$url" || true)
            echo "attempt $i: $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "::error::$url did not return 200 within five minutes"
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The run's own record, committed back. Without this the only way to learn what happened is the
      # Actions API, and the token available here cannot read it. Git is the channel that works.
      - name: Record the outcome
        if: always()
        continue-on-error: true
        run: |
          mkdir -p data/runs
          printf '{"at":"%s","sha":"%s","run":"%s","status":"%s"}\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${GITHUB_SHA::7}" "${GITHUB_RUN_ID}" "${JOB_STATUS}" \
            > "data/runs/$(date -u +%Y%m%dT%H%M%S)-${GITHUB_RUN_ID}.json"
          git config user.name "archipelago-publisher"
          git config user.email "publisher@users.noreply.github.com"
          git add data/runs
          git commit -m "run: record ${GITHUB_RUN_ID} ${JOB_STATUS}" || exit 0
          git push origin HEAD:main || true
        env:
          JOB_STATUS: ${{ job.status }}

      - name: Record and announce
        if: always()
        continue-on-error: true
        run: |
          slug=$(git log -1 --pretty=%s | sed -n 's/^publish: \(.*\)$/\1/p')
          if [ -z "$slug" ]; then slug=$(ls -1 src/content/blog 2>/dev/null | tail -1 | sed 's/\.md$//'); fi
          if [ -z "$slug" ]; then
            node tools/record-publish.mjs --slug=pipeline --status=failed || true
          elif [ "${{ job.status }}" = "success" ]; then
            node tools/record-publish.mjs --slug="$slug" --status=published
          else
            node tools/record-publish.mjs --slug="$slug" --status=failed
          fi
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}

      # The console write is its own step, and it is not allowed to be silent. `|| true` was here
      # before and it hid a shell error for two runs: the workflow was green and the table stayed
      # empty. A failure now prints a warning, the captured output, and a summary block - and still
      # does not fail the run, because a console that cannot be reached must not undo a published
      # article.
      - name: Record in the Feishu console
        if: always()
        continue-on-error: true
        run: |
          set +e
          # The article this run published, by filename. github.ref_name gave "main" and a URL that
          # 404s; the commit subject is only right when the message starts with "publish:".
          SLUG="${ARTICLE_SLUG:-}"
          [ -z "$SLUG" ] && SLUG=$(git log -1 --name-only --pretty=format: | sed -n "s#^src/content/blog/\(.*\)\.md$#\1#p" | head -1)
          [ -z "$SLUG" ] && SLUG=$(ls -1t src/content/blog/*.md 2>/dev/null | head -1 | xargs -r basename | sed "s/\.md$//")
          echo "slug: ${SLUG:-none}"
          node tools/lib/feishu-bitable.mjs \
            --run-id="${GITHUB_RUN_ID}" \
            --status="${STATUS}" \
            --slug="${SLUG}" \
            --sha="${GITHUB_SHA}" > bitable.log 2>&1
          code=$?
          set -e
          cat bitable.log
          if [ "$code" -ne 0 ]; then
            echo "::warning::feishu-bitable exited $code; the row is queued as pending_sync"
            {
              echo "### Feishu console write failed (exit $code)"
              echo '```'
              tail -20 bitable.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          STATUS: ${{ job.status }}
          # github.ref_name is the branch - 'main' on every push - so the console row was written
        # with 主题=main and a URL that 404s. The article's own filename is the only honest source.
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_BITABLE_APP_TOKEN: ${{ secrets.FEISHU_BITABLE_APP_TOKEN }}