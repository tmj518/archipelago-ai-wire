# B线 — a second content line on the same site, three days a week.
#
# The site deploys from git, so there is no publishing API to configure: a pushed article is a
# published article. What B线 adds is a second brief - one real one-person business case, in English,
# three times a week - run through the same gates as A线.
#
# It reuses the A线 pipeline on purpose. A second copy of the pipeline would be a second set of bugs.
name: B line

on:
  schedule:
    # 18:00 UTC = 02:00 Asia/Singapore. Tuesday (2), Thursday (4), Saturday (6).
    - cron: "0 18 * * 2,4,6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: b-line
  cancel-in-progress: false

jobs:
  b-line:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Preflight
        run: |
          missing=""
          [ -z "${ARK_API_KEY:-}" ] && missing="$missing ARK_API_KEY"
          [ -z "${DEEPSEEK_API_KEY:-}" ] && missing="$missing DEEPSEEK_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::B line is not configured:$missing"
            exit 1
          fi
          if [ ! -s data/b-line/brief.md ]; then
            echo "::error::no brief at data/b-line/brief.md"
            exit 1
          fi
          echo "b-line: brief present"

      - name: Find a subject
        run: |
          set +e
          node tools/research.mjs --budget="${RESEARCH_BUDGET:-0.50}" --sources="${RESEARCH_SOURCES:-10}"
          code=$?
          set -e
          if [ "$code" != "0" ]; then
            echo "b-line: research ended with $code - a quiet day, not a failure"
            echo "B_SKIP=1" >> "$GITHUB_ENV"
          fi

      - name: Write and gate
        if: env.B_SKIP != '1'
        run: |
          export B_LINE_BRIEF="$(cat data/b-line/brief.md)"
          set +e
          node tools/cloud-orchestrator.mjs
          code=$?
          set -e
          echo "b-line orchestrator exit: $code"
          case "$code" in
            0) echo "B_LINE_OUTCOME=OK" >> "$GITHUB_ENV" ;;
            *) echo "B_LINE_OUTCOME=FAILED ($code)" >> "$GITHUB_ENV" ;;
          esac
        env:
          B_LINE_BRIEF_PATH: data/b-line/brief.md
          MAX_ARTICLES_PER_DAY: "1"
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          ARK_REVIEW_API_KEY: ${{ secrets.ARK_REVIEW_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          AGENT_USD_LIMIT: ${{ vars.AGENT_USD_LIMIT }}
          CONTENT_GENERATOR: node tools/cloud-orchestrator.mjs

      - name: Publish
        if: env.B_SKIP != '1'
        run: |
          git config user.name "b-line-publisher"
          git config user.email "publisher@users.noreply.github.com"
          for p in src/content src/lib data/outcomes logs/usage.jsonl; do
            [ -e "$p" ] && git add "$p" || true
          done
          if git diff --cached --quiet; then
            echo "b-line: nothing to publish"
            exit 0
          fi
          git commit -m "b-line: $(date -u +%Y-%m-%d) case study"
          git push origin HEAD:main

      - name: Report
        if: always()
        run: echo "B_LINE_OUTCOME=${B_LINE_OUTCOME:-QUIET}" >> "$GITHUB_STEP_SUMMARY"
