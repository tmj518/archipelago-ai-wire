# B线 — one success case every day, published without a review.
#
# Same site, same deploy path (git push -> Cloudflare Pages), so there is nothing to configure and no
# API key to hold. What differs from A线: its own cron, its own quota, its own brief, and no reviewer.
name: B line

on:
  schedule:
    # 03:00 UTC = 11:00 Asia/Singapore, every day.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: b-line
  cancel-in-progress: false

jobs:
  b-line:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Preflight
        run: |
          echo "b-line: brief at data/b-line/brief.md ($(wc -c < data/b-line/brief.md) bytes)"
          if [ ! -s data/b-line/brief.md ]; then
            echo "::error::B line has no brief"; exit 1
          fi

      - name: Find a subject
        run: |
          set +e
          node tools/research.mjs --budget="${RESEARCH_BUDGET:-0.50}" --sources="${RESEARCH_SOURCES:-12}"
          code=$?
          set -e
          if [ "$code" != "0" ]; then
            echo "b-line: research ended with $code - a quiet day for this line, not a failure"
            echo "B_SKIP=1" >> "$GITHUB_ENV"
          fi
        env:
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          ARK_REVIEW_API_KEY: ${{ secrets.ARK_REVIEW_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          AGENT_USD_LIMIT: ${{ vars.AGENT_USD_LIMIT }}

      - name: Write, gate and publish
        if: env.B_SKIP != '1'
        run: |
          export B_LINE_BRIEF="$(cat data/b-line/brief.md)"
          set +e
          node tools/cloud-orchestrator.mjs
          code=$?
          set -e
          echo "b-line orchestrator exit: $code"
          if [ "$code" = "0" ]; then echo "B_LINE_OUTCOME=OK" >> "$GITHUB_ENV"; else echo "B_LINE_OUTCOME=FAILED:$code" >> "$GITHUB_ENV"; fi
        env:
          # The one instruction that makes this a different line: publish without a second opinion.
          B_LINE_SKIP_REVIEW: "1"
          MAX_ARTICLES_PER_DAY: "1"
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          ARK_REVIEW_API_KEY: ${{ secrets.ARK_REVIEW_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          AGENT_USD_LIMIT: ${{ vars.AGENT_USD_LIMIT }}
          CONTENT_GENERATOR: node tools/cloud-orchestrator.mjs

      - name: Publish the article
        if: env.B_SKIP != '1'
        run: |
          git config user.name "b-line-publisher"
          git config user.email "publisher@users.noreply.github.com"
          for p in src/content src/lib data/outcomes logs/usage.jsonl data/feedback; do
            [ -e "$p" ] && git add "$p" || true
          done
          if git diff --cached --quiet; then
            echo "b-line: nothing new to publish"; exit 0
          fi
          slug=$(git diff --cached --name-status --diff-filter=A | awk '$1=="A" && $2 ~ /^src\/content\/blog\// {print $2; exit}')
          name=$(basename "${slug:-case-study}" .md)
          echo "ARTICLE_SLUG=$name" >> "$GITHUB_ENV"
          git commit -m "b-line: publish $name"
          git push origin HEAD:main

      - name: Verify live
        if: env.B_SKIP != '1' && env.ARTICLE_SLUG != ''
        run: |
          url="https://www.ghiblistyled.com/blog/${ARTICLE_SLUG}/"
          for i in 1 2 3 4 5 6; do
            sleep 20
            code=$(curl -sS -o /dev/null -w "%{http_code}" "$url" || echo 000)
            echo "b-line: $url -> $code"
            [ "$code" = "200" ] && break
          done

      - name: Report
        if: always()
        run: echo "B_LINE_OUTCOME=${B_LINE_OUTCOME:-QUIET}" >> "$GITHUB_STEP_SUMMARY"
