# B线 — one success case every day, published without a review.
#
# Same site, same deploy path (git push -> Cloudflare Pages), so there is nothing to configure and no
# API key to hold. What differs from A线: its own cron, its own quota, its own brief, and no reviewer.
name: B line

on:
  schedule:
    # 03:00 UTC = 11:00 Asia/Singapore, every day.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: b-line
  cancel-in-progress: false

jobs:
  b-line:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Preflight
        run: |
          echo "b-line: brief at data/b-line/brief.md ($(wc -c < data/b-line/brief.md) bytes)"
          if [ ! -s data/b-line/brief.md ]; then
            echo "::error::B line has no brief"; exit 1
          fi

      # A claim with no article beside it is a tombstone: publish-guard returns "duplicate" for that slug
      # for ever, so the article can never be written. On 2026-11-07 two B线 runs were refused on a claim
      # created by the run before them.
      - name: Clear claims with no article
        run: |
          n=0
          for f in src/content/blog/.claims/*.json; do
            [ -e "$f" ] || continue
            base=$(basename "$f" .json)
            if [ ! -f "src/content/blog/$base.md" ]; then
              rm -f "$f"; n=$((n+1)); echo "cleared stale claim: $base"
            fi
          done
          echo "cleared $n stale claim(s)"

      # B线 does not use A線's research: it asks which one-person case nobody has written yet, from a
      # pool where every number has a source. Exit 2 means the pool is exhausted, which is a quiet day.
      - name: Choose a case
        run: |
          set +e
          node tools/b-line/select.mjs
          code=$?
          set -e
          if [ "$code" != "0" ]; then
            echo "b-line: no case left to write ($code) - a quiet day for this line, not a failure"
            echo "B_SKIP=1" >> "$GITHUB_ENV"
          fi
        env:
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          ARK_REVIEW_API_KEY: ${{ secrets.ARK_REVIEW_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          AGENT_USD_LIMIT: ${{ vars.AGENT_USD_LIMIT }}

      # B线 writes with the same writer as A线 and publishes the file itself.
      #
      # The orchestrator exists to choose, review and guard. This line was told to publish without a
      # review, and every attempt to make the orchestrator skip one ended in a rejection branch deeper
      # inside it. So the line uses the writer directly: the directorate already carries the case and its
      # figures, the writer returns a draft, the draft is copied into the collection and pushed. Fewer
      # moving parts, and nothing that can silently overrule the instruction.
      - name: Write the article
        run: |
          export B_LINE_BRIEF="$(cat data/b-line/brief.md)"
          set +e
          node tools/cloud-executor.mjs --directive-file=data/directive.json
          code=$?
          set -e
          echo "b-line writer exit: $code"
          if [ "$code" != "0" ]; then
            echo "::error::the writer refused the draft (exit $code)"
            ls -la data/drafts || true
            exit "$code"
          fi
          ls -la data/drafts | tail -5
        env:
          B_LINE_BRIEF: ""
          LAUNCH_MODE: "1"
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          ARK_REVIEW_API_KEY: ${{ secrets.ARK_REVIEW_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          AGENT_USD_LIMIT: ${{ vars.AGENT_USD_LIMIT }}

      - name: Publish the draft
        run: |
          slug=$(cat data/tmp/last-slug.txt 2>/dev/null || true)
          if [ -z "$slug" ]; then
            slug=$(node -e 'const d=require("./data/directive.json"); process.stdout.write(d.slug)')
          fi
          echo "slug: $slug"
          src="data/drafts/$slug.md"
          if [ ! -f "$src" ]; then
            echo "::error::no draft at $src"; ls -la data/drafts | tail -10; exit 1
          fi
          cp "$src" "src/content/blog/$slug.md"
          echo "ARTICLE_SLUG=$slug" >> "$GITHUB_ENV"
          echo "wrote src/content/blog/$slug.md ($(wc -c < "src/content/blog/$slug.md") bytes)"

      - name: Confirm the article exists
        if: env.B_SKIP != '1'
        run: |
          ls -la data/tmp/last-slug.txt 2>/dev/null || echo "no last-slug.txt"
          slug=$(cat data/tmp/last-slug.txt 2>/dev/null || true)
          echo "orchestrator slug: ${slug:-none}"
          if [ -n "$slug" ] && [ ! -f "src/content/blog/$slug.md" ]; then
            echo "::error::the orchestrator reported $slug but src/content/blog/$slug.md does not exist"
            ls -la src/content/blog | tail -20
            exit 1
          fi

      - name: Publish the article
        if: env.B_SKIP != '1'
        run: |
          git config user.name "b-line-publisher"
          git config user.email "publisher@users.noreply.github.com"
          for p in src/content src/lib data/outcomes logs/usage.jsonl data/feedback; do
            [ -e "$p" ] && git add "$p" || true
          done
          if git diff --cached --quiet; then
            echo "b-line: nothing new to publish"; exit 0
          fi
          # Only the article file itself: src/content/blog/.claims/<slug>.json also starts with that path and
          # was captured as the slug on 2026-11-07, so the live check asked for <slug>.json and got 404.
          slug=$(git diff --cached --name-status --diff-filter=A | awk '$1=="A" && $2 ~ /^src\/content\/blog\/[^/]+\.md$/ {print $2; exit}')
          name=$(basename "${slug:-case-study}" .md)
          echo "ARTICLE_SLUG=$name" >> "$GITHUB_ENV"
          git commit -m "b-line: publish $name"
          git push origin HEAD:main

      - name: Verify live
        if: env.B_SKIP != '1' && env.ARTICLE_SLUG != ''
        run: |
          url="https://www.ghiblistyled.com/blog/${ARTICLE_SLUG}/"
          for i in 1 2 3 4 5 6; do
            sleep 20
            code=$(curl -sS -o /dev/null -w "%{http_code}" "$url" || echo 000)
            echo "b-line: $url -> $code"
            [ "$code" = "200" ] && break
          done

      - name: Report
        if: always()
        run: |
          echo "B_LINE_OUTCOME=${B_LINE_OUTCOME:-QUIET}" >> "$GITHUB_STEP_SUMMARY"
          # A green job that published nothing is worse than a red one: it says the line works.
          case "${B_LINE_OUTCOME:-QUIET}" in
            OK|QUIET) ;;
            *) echo "::error::B line did not publish (${B_LINE_OUTCOME})"; exit 1 ;;
          esac
