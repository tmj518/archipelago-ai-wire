# B线 — one success case every day, with independent review and blocking quality gates.
#
# Same site, same deploy path (git push -> Cloudflare Pages), so there is nothing to configure and no
# Same site and deploy path as A线. B线 has its own schedule, quota and brief, but shares the fact-checking
# and pre-publish safety standard: missing review evidence or failed gates stop publication.
name: B line

on:
  schedule:
    # 03:00 UTC = 11:00 Asia/Singapore, every day.
    # 11:00 Malaysia time is the intended slot, but GitHub scheduler is routinely hours late on
    # this repository - A line has been seen five hours behind. A second schedule every two hours
    # compensates: whichever fires first finds the day done and exits in seconds.
    - cron: "0 3 * * *"
    # Every twenty minutes while unattended operation is still unproven. The guard makes a wasted run
    # cost ten seconds, and it is the only way to see a scheduled run fire today rather than tomorrow.
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: b-line
  cancel-in-progress: false

jobs:
  b-line:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # One article a day, whichever schedule fires first.
      - name: Already published today
        run: |
          today=$(date -u +%Y-%m-%d)
          # xargs -r: with no input, grep must not run and fail the step. A guard that turns red on
          # every quiet run is worse than no guard.
          n=$(grep -l '^category: success-cases' src/content/blog/*.md 2>/dev/null | xargs -r grep -l "^publishDate: $today" 2>/dev/null | wc -l || echo 0)
          n=${n:-0}
          echo "articles dated $today in success-cases: $n"
          if [ "$n" -ge 1 ]; then
            echo "B line already published today; exiting without spending anything"
            echo "B_SKIP=1" >> "$GITHUB_ENV"
            echo "B_LINE_OUTCOME=QUIET" >> "$GITHUB_ENV"
          fi

      - name: Preflight
        if: env.B_SKIP != '1'
        run: |
          echo "b-line: brief at data/b-line/brief.md ($(wc -c < data/b-line/brief.md) bytes)"
          if [ ! -s data/b-line/brief.md ]; then
            echo "::error::B line has no brief"; exit 1
          fi

      # Generate only after retrieving current source material; the generator requires an independent
      # source-based reviewer before it writes an article.
      - name: Write the article
        if: env.B_SKIP != '1'
        run: |
          set +e
          node tools/b-line/generate.mjs
          code=$?
          set -e
          echo "b-line generate exit: $code"
          case "$code" in
            0) echo "B_LINE_OUTCOME=GENERATED" >> "$GITHUB_ENV" ;;
            2) echo "B_SKIP=1" >> "$GITHUB_ENV"; echo "B_LINE_OUTCOME=QUIET" >> "$GITHUB_ENV" ;;
            3) echo "B_LINE_OUTCOME=REVIEW_HUMAN_REQUIRED" >> "$GITHUB_ENV"; exit 1 ;;
            *) echo "B_LINE_OUTCOME=FAILED_GENERATION" >> "$GITHUB_ENV"; exit "$code" ;;
          esac
        env:
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          ARK_MODEL: ${{ vars.ARK_MODEL }}
          ARK_REVIEW_API_KEY: ${{ secrets.ARK_REVIEW_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          AGENT_USD_LIMIT: ${{ vars.AGENT_USD_LIMIT }}

      # All blocking checks run against the generated article and full site before any commit.
      - name: Validate and gate the article
        if: env.B_SKIP != '1'
        run: |
          set -euo pipefail
          slug=$(cat data/tmp/last-slug.txt)
          if ! [[ "$slug" =~ ^[a-z0-9]+([a-z0-9-]*[a-z0-9])?$ ]]; then
            echo "::error::invalid or missing generated slug"
            echo "B_LINE_OUTCOME=FAILED_VALIDATION" >> "$GITHUB_ENV"
            exit 1
          fi
          article="src/content/blog/${slug}.md"
          test -s "$article"
          echo "ARTICLE_SLUG=$slug" >> "$GITHUB_ENV"
          node tools/validate-article.mjs --changed || { echo "B_LINE_OUTCOME=FAILED_VALIDATION" >> "$GITHUB_ENV"; exit 1; }
          node tools/qa-check.mjs "$article" || { echo "B_LINE_OUTCOME=FAILED_QUALITY_GATE" >> "$GITHUB_ENV"; exit 1; }
          pnpm exec astro build || { echo "B_LINE_OUTCOME=FAILED_BUILD" >> "$GITHUB_ENV"; exit 1; }
          node tools/gate.mjs --fresh || { echo "B_LINE_OUTCOME=FAILED_SITE_GATE" >> "$GITHUB_ENV"; exit 1; }
          echo "B_LINE_OUTCOME=QUALITY_PASSED" >> "$GITHUB_ENV"

      - name: Publish the article
        if: env.B_SKIP != '1'
        run: |
          set -euo pipefail
          slug="$ARTICLE_SLUG"
          test -n "$slug"
          test -s "src/content/blog/${slug}.md"
          git config user.name "b-line-publisher"
          git config user.email "publisher@users.noreply.github.com"
          git add -- "src/content/blog/${slug}.md" data/b-line/cases.json
          if git diff --cached --quiet; then
            echo "::error::no article or case-pool change staged; refusing a false success"
            exit 1
          fi
          staged_paths=$(git diff --cached --name-only)
          unexpected=""
          while IFS= read -r staged; do
            case "$staged" in
              "src/content/blog/${slug}.md"|"data/b-line/cases.json") ;;
              "") ;;
              *) unexpected="${unexpected}${staged}"$'\n' ;;
            esac
          done <<< "$staged_paths"
          if [ -n "$unexpected" ]; then
            echo "::error::unexpected paths staged: $unexpected"
            exit 1
          fi
          git commit -m "b-line: publish $slug" || { echo "B_LINE_OUTCOME=FAILED_COMMIT" >> "$GITHUB_ENV"; exit 1; }
          sha=$(git rev-parse HEAD)
          git push origin HEAD:main || { echo "B_LINE_LOCAL_COMMIT=$sha" >> "$GITHUB_ENV"; echo "B_LINE_OUTCOME=FAILED_PUSH" >> "$GITHUB_ENV"; exit 1; }
          echo "B_LINE_PUBLISH_COMMIT=$sha" >> "$GITHUB_ENV"
          echo "B_LINE_OUTCOME=COMMITTED" >> "$GITHUB_ENV"

      - name: Verify live article, Sitemap and RSS
        if: env.B_SKIP != '1' && env.ARTICLE_SLUG != ''
        run: |
          node tools/verify-publication.mjs --slug="$ARTICLE_SLUG" || { echo "B_LINE_OUTCOME=FAILED_LIVE_VERIFY" >> "$GITHUB_ENV"; exit 1; }
          echo "B_LINE_VERIFY_STATUS=ARTICLE_CANONICAL_TITLE_BODY_SITEMAP_RSS_VERIFIED" >> "$GITHUB_ENV"
          echo "B_LINE_VERIFIED_URL=https://www.ghiblistyled.com/blog/${ARTICLE_SLUG}/" >> "$GITHUB_ENV"
          echo "B_LINE_OUTCOME=PUBLISHED" >> "$GITHUB_ENV"
          exit 0
        env:
          VERIFY_ATTEMPTS: "6"
          VERIFY_DELAY_MS: "20000"

      - name: Report
        if: always()
        run: |
          outcome="${B_LINE_OUTCOME:-FAILED}"
          echo "B line outcome: $outcome" >> "$GITHUB_STEP_SUMMARY"
          echo "run ID: ${GITHUB_RUN_ID}; attempt: ${GITHUB_RUN_ATTEMPT}; head SHA: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "failure classification: $outcome" >> "$GITHUB_STEP_SUMMARY"
          echo "publish commit: ${B_LINE_PUBLISH_COMMIT:-none}" >> "$GITHUB_STEP_SUMMARY"
          echo "reviewer: ${B_LINE_REVIEWER_PROVIDER:-unknown}/${B_LINE_REVIEWER_MODEL:-unknown} level=${B_LINE_REVIEW_INDEPENDENCE_LEVEL:-unknown} (${B_LINE_REVIEW_VERDICT:-unknown})" >> "$GITHUB_STEP_SUMMARY"
          echo "verified URL: ${B_LINE_VERIFIED_URL:-none}; URL/Sitemap/RSS: ${B_LINE_VERIFY_STATUS:-not-run}" >> "$GITHUB_STEP_SUMMARY"
          case "$outcome" in
            PUBLISHED|QUIET) ;;
            *) echo "::error::B line did not reach a verified published or quiet terminal state ($outcome)"; exit 1 ;;
          esac
