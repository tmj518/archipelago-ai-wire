# Alert on failure - one place, so a red run is not silence.
#
# GitHub already shows a failed run, but nobody watches the Actions tab. This workflow listens for the
# completion of the scheduled jobs and pushes a card to Feishu when one fails. It sends nothing on
# success: an alert channel that also reports good news stops being read.

name: Alert on failure

on:
  workflow_run:
    workflows: ["Data refresh", "Content day", "Daily health", "CI", "B line"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  notify:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Record the failure

        if: always()

        run: |

          {

            echo "## Failure record"

            echo ""

            echo "- workflow: `${{ github.event.workflow_run.name }}`"

            echo "- conclusion: `${{ github.event.workflow_run.conclusion }}`"

            echo "- run: `${{ github.event.workflow_run.html_url }}`"

            echo "- attempt: `${{ github.event.workflow_run.run_attempt }}`"

            echo "- branch: `${{ github.event.workflow_run.head_branch }}`"

            echo "- note: recorded whether or not the card is delivered"

          } >> "$GITHUB_STEP_SUMMARY"

      - name: Classify failed job and step
        id: failure_steps
        if: always()
        run: |
          set +e
          details=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/jobs" --jq '[.jobs[]? | select(.conclusion == "failure") | .name + ": " + ([.steps[]? | select(.conclusion == "failure") | .name] | join(", "))] | join("; ")' 2>failure-details.err)
          code=$?
          if [ "$code" -ne 0 ] || [ -z "$details" ]; then
            echo "steps=UNKNOWN" >> "$GITHUB_OUTPUT"
            echo "- failed job/step classification: UNKNOWN (Actions API exit $code; see alert run log)" >> "$GITHUB_STEP_SUMMARY"
          else
            details=$(printf '%s' "$details" | tr '\n' ' ' | cut -c1-1000)
            echo "steps=$details" >> "$GITHUB_OUTPUT"
            echo "- failed job/step classification: $details" >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}


      - name: Send the card
        if: always()
        run: |
          if [ -z "${FEISHU_WEBHOOK:-}" ]; then
            echo "::error::FEISHU_WEBHOOK is not set; no card sent - the failure is recorded in this run summary"
            exit 1
          fi
          ROUTE="$GITHUB_WORKFLOW" PIPELINE_OUTCOME="FAILED" node tools/notify-feishu.mjs
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          GITHUB_WORKFLOW: ${{ github.event.workflow_run.name }}
          FAILED_STEP: "${{ github.event.workflow_run.name }} (${{ github.event.workflow_run.conclusion }}; run ${{ github.event.workflow_run.id }}, attempt ${{ github.event.workflow_run.run_attempt }}; failed steps: ${{ steps.failure_steps.outputs.steps || 'UNKNOWN' }})"
