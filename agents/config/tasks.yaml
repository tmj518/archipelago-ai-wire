# agents/config/tasks.yaml
# Archipelago Intel 终版 11 任务，单向数据流；任一失败中断下游

# 01 选题&信源采集
task_01_scout:
  description: >
    Poll official public sources (MITI/MIDA/MATRADE, central banks, statistics
    offices, ASEAN Secretariat) for economic, tariff, industry, or cross-border
    policy topics with commercial value for Malaysian SMEs. Return 3 candidates
    as JSON with title, summary, source_url, publish_date.
  expected_output: "JSON array of 3 candidates"
  agent: agent_01_scout_source

# 02 深度调研（STORM）
task_02_research:
  description: >
    Pick the top candidate. Run multi-dimensional research: event background,
    historical data, multiple institutional viewpoints. Compile a research pack
    with 5-8 evidence items, each with source URL.
  expected_output: "Research pack: 5-8 evidence items with URLs"
  agent: agent_02_researcher

# 03 事实核验
task_03_factcheck:
  description: >
    Cross-verify each evidence item against a second independent source. If any
    core number conflicts between sources, REJECT the topic. Output a fact-
    check report: PASS / REJECTED.
  expected_output: "Fact-check report with PASS/REJECT verdict"
  agent: agent_03_fact_checker

# 04 决策备忘录撰写（SCQA）
task_04_write:
  description: >
    Write an 800-1200 word English decision memo using SCQA structure:
    1) Answer (3 sentences, conclusion first)
    2) Situation (current market landscape)
    3) Complication (what changed, what the market misses)
    4) Evidence (3-5 items with source links)
    5) Implication (what it means for importers, exporters, investors)
    6) Action (1-2 concrete things to do this week)
    7) References (source list)
    8) 2-minute audio script
    Label every claim: Confirmed fact / Reasonable inference / Our view.
  expected_output: "Complete decision memo markdown"
  agent: agent_04_writer

# 05 SEO 结构化
task_05_seo:
  description: >
    Generate title (max 120 chars), meta description (max 300 chars), URL slug,
    H2/H3 outline. Identify the information gap vs top-3 SERP results.
  expected_output: "SEO fields + slug + outline"
  agent: agent_05_seo_optimizer

# 06 合规质检
task_06_compliance:
  description: >
    Check neutrality, sensitive language, banned words. Add standard disclaimer.
    Score the memo. If below threshold (6/10), send back for rewrite.
  expected_output: "Compliance score + pass/fail + edits applied"
  agent: agent_06_compliance_reviewer

# 07 多语言润色
task_07_polish:
  description: >
    Native-level English polish. Preserve every number and source label. Remove
    AI tells. Ensure Bloomberg/FT style.
  expected_output: "Polished English memo"
  agent: agent_07_translator_polisher

# 08 多载体衍生
task_08_media:
  description: >
    From the polished memo, derive: (a) podcast reading script with [male Brian]
    / [female Jenny] cues and fixed intro/outro; (b) 3-minute YouTube narration
    script. Keep conclusion first.
  expected_output: "podcast.md + youtube.md"
  agent: agent_08_media_generator

# 09 静态页面生成
task_09_html:
  description: >
    Emit a valid Astro content-collection markdown file with frontmatter:
    title, description, pubDate, figures (>=5 five-tuple), sources (>=3),
    stakes: priced. Save to src/content/posts/<slug>.md.
  expected_output: "Valid markdown file ready for build"
  agent: agent_09_html_builder

# 10 自动化发布
task_10_publish:
  description: >
    Run node tools/qa-check.mjs --all, reviewer-check, preflight --build. If all
    green, git add/commit/push. Log deploy status.
  expected_output: "Deploy log: gates status, commit hash"
  agent: agent_10_publisher

# 11 数据分析闭环
task_11_analytics:
  description: >
    Placeholder for GSC analytics (not yet connected). Output a JSON note on
    which topic angles got the most engagement, to feed back to task_01.
  expected_output: "Topic weight adjustment note"
  agent: agent_11_analytics_feedback
